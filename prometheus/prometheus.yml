global:
  scrape_interval: 5s # Scrape metrics every 5 seconds for real-time dashboard updates
  evaluation_interval: 5s

scrape_configs:
  - job_name: "llm-gateway"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:8000"] # Points back to your Windows host machine where Uvicorn is running