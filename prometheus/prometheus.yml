global:
  scrape_interval: 15s     # Adjusted from 5s to 15s to comply with spec constraints and avoid storage inflation
  evaluation_interval: 15s

scrape_configs:
  - job_name: "llm-gateway"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["gateway:8000"] # Direct container network layout routing (resolves Critical Defect 1)