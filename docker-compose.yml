version: '3.8'

services:
  gateway:
    build: ./gateway
    container_name: llm-gateway
    ports:
      - "8000:8000"
    volumes:
      - ./gateway:/app
    env_file:
      - ./gateway/.env
    environment:
      - REDIS_HOST=gateway-redis
      - REDIS_PORT=6379
      - OLLAMA_HOST=http://host.docker.internal:11434  # <-- FIX: Bridges container requests to your Windows desktop Ollama app
    depends_on:
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Allows the container network to cleanly resolve the host keyword
    restart: always

  redis:
    image: redis:7.2-alpine
    container_name: gateway-redis
    ports:
      - "6379:6379"
    restart: always

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: gateway-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: always

  grafana:
    image: grafana/grafana:10.0.0
    container_name: gateway-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning # Dynamic first-boot provisioning link hook
    restart: always