services:
  gateway-redis:
    image: redis/redis-stack-server:latest
    container_name: gateway-redis
    ports:
      - "6379:6379"
      - "8001:8001"
    networks:
      - gateway-network

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: llm-gateway
    ports:
      - "8000:8000"
    env_file:
      - ./gateway/.env
    depends_on:
      - gateway-redis
    networks:
      - gateway-network

  gateway-prometheus:
    image: prom/prometheus:latest
    container_name: gateway-prometheus
    volumes:
      # FIXED: Points cleanly to your true root-level prometheus folder config
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - gateway-network

  gateway-grafana:
    image: grafana/grafana:latest
    container_name: gateway-grafana
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    depends_on:
      - gateway-prometheus
    networks:
      - gateway-network

networks:
  gateway-network:
    driver: bridge